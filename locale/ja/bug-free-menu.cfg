[mod-name]
bug-free-menu=Bug Free Menu

[mod-description]
bug-free-menu=タイトル画面に表示されるデモのうち、原住生物が出現するものを非表示にします。

[mod-setting-name]
bug-free-menu-hide-biters=バイター・スピッター・ワームのデモを非表示にする
bug-free-menu-hide-demolishers=デモリッシャーのデモを非表示にする
bug-free-menu-hide-pentapods=ペンタポッドのデモを非表示にする

[mod-setting-description]
bug-free-menu-hide-biters=ナウヴィスの原住生物(バイター・スピッター・ワーム)が出現するメニューシミュレーションを非表示にします。
bug-free-menu-hide-demolishers=ヴルカヌスの原住生物(デモリッシャー)が出現するメニューシミュレーションを非表示にします。
bug-free-menu-hide-pentapods=グレバの原住生物(ペンタポッド)が出現するメニューシミュレーションを非表示にします。ベースゲームのクモ恐怖症モード(脚の描画のみに影響)とは独立した設定です。
